name: Getsafe
description: >-
  Getsafe (Getsafe Digital GmbH) is a Heidelberg, Germany-based digital insurance company (insurtech)
  that lets consumers buy, manage, and file claims for insurance entirely through a mobile app. Getsafe
  operates as a licensed insurance carrier and offers 15+ products across liability and legal protection,
  health (public, private, dental, and travel), living (contents and drone), pet (pet health and dog
  liability), and protection and finance (income protection, term life, private pension, and children's
  savings). It serves 500k+ customers in Germany and Austria with English-language, app-based support.
  In 2018 Getsafe launched an early-access P&C and health insurance API and embeddable widget for partner
  distribution; that partner API is no longer offered as a public self-service developer program, so this
  profile is maintained as a company record. Backed by earlybird and partech.
